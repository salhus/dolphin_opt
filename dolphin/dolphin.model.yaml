chrono-version: 9.0

model:
  name: dolphin_opt
  angle_degrees: false

  data_path:
    type: RELATIVE
    root: "."

  bodies:

  - name: body1
    location: [0, 0, 0]
    mass: 2.896449242653072e+04
    fixed: false
    inertia:
      moments: [4.617092374535835e+05,  4.616541125688138e+05, 1.150470818971075e+04]
      products: [0, 0, 0]
    com:
      location: [6.000e-3, -3.000e-3, -7.787e+0]
      orientation: [0, 0, 0]
    visualization:
        model_file: ./assets/geometry/auv_mesh_L10_R1.obj

  - name: body2
    location: [0, 0, 0]
    mass: 6.000000089406967e+02
    fixed: false
    inertia:
      moments: [9.781625298532427e+02, 7.829982968371633e+02,	1.957197885964702e+02]
      products: [0,0,0]
    com:
      location: [0.000e+0, 2.000e+0, -2.250e+0]
      orientation: [0, 0, 0]
    visualization:
        model_file: ./assets/geometry/flap_left_WD2x3.obj

  - name: body3
    location: [0, 0, 0]
    mass: 6.000000089406967e+02
    fixed: false
    inertia:
      moments: [9.781625298532427e+02, 7.829982968371633e+02,	1.957197885964702e+02]
      products: [0, 0, 0]
    com:
      location: [0.000e+0, -2.000e+0, -2.250e+0]
      orientation: [0, 0, 0]
    visualization:
        model_file: ./assets/geometry/flap_right_WD2x3.obj


  - name: ground
    location: [0, 0, -50.0]
    mass: 999
    fixed: true
    inertia:
      moments: [999, 999, 999]
      products: [0, 0, 0]
    com:
      location: [0, 0, -50]
      orientation: [0, 0, 0]

  joints:

  - name: hinge
    type: REVOLUTE
    body1: body1
    body2: body2
    location: [0.0, 2.0, 1.5]
    axis: [0,1,0]
  - name: hinge
    type: REVOLUTE
    body1: body1
    body2: body3
    location: [0.0, -2.0, 1.5]
    axis: [0,-1,0]

  rsdas:
  - name: PTO_left
    type: RSDA
    body1: body1
    body2: body2
    location: [0.0, 0.0, 1.5]
    axis: [0, 1, 0]
    spring_coefficient: 0.5e4
    damping_coefficient: 1.0e3
    free_angle: 0.0
  - name: PTO_right
    type: RSDA
    body1: body1
    body2: body3
    location: [0.0, 0.0, 1.5]
    axis: [0, 1, 0]
    spring_coefficient: 0.5e4
    damping_coefficient: 1.0e3
    free_angle: 0.0

  tsdas:
    - name: moor1
      type: TSDA
      body1: body1
      body2: ground
      point1: [ 0,   0.0,     -2.0]
      point2: [ 0,   15.0,   -50.0]
      spring_coefficient: 0.5e4
      damping_coefficient: 2e4
      free_length: 51.3
      visualization:
        type: SPRING
        radius: 0.8
        resolution: 512
        turns: 32

    - name: moor2
      type: TSDA
      body1: body1
      body2: ground
      point1: [ 0,     0.0,     -2.0]
      point2: [ 0,   -15.0,   -50.0]
      spring_coefficient: 0.5e4
      damping_coefficient: 2e4
      free_length: 51.3
      visualization:
        type: SPRING
        radius: 0.8
        resolution: 512
        turns: 32
